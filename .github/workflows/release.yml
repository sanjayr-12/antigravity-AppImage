name: Check & Release AppImage

on:
  schedule:
    # Run every 6 hours
    - cron: '0 */6 * * *'
  workflow_dispatch:
    inputs:
      force_build:
        description: 'Force build even if release tag exists'
        required: false
        type: boolean
        default: false
      custom_version:
        description: 'Specific version to build (e.g. 2.27.0). Leave empty for auto-detect.'
        required: false
        type: string
        default: ''
      custom_execution_id:
        description: 'Specific execution_id (e.g. 4933976025071616). Required if custom_version is set.'
        required: false
        type: string
        default: ''

permissions:
  contents: write

concurrency:
  group: release-appimage
  cancel-in-progress: false

jobs:
  check-and-release:
    name: Check & Release Antigravity AppImage
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Keep GitHub Actions alive
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          LAST_COMMIT_DATE=$(git log -1 --format=%ct 2>/dev/null || echo "0")
          NOW=$(date +%s)
          DAYS_SINCE=$(( (NOW - LAST_COMMIT_DATE) / 86400 ))
          echo "Days since last commit: $DAYS_SINCE"
          if [ "$DAYS_SINCE" -ge 45 ]; then
            echo "Repository approaching inactivity threshold. Pushing keepalive commit..."
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git commit --allow-empty -m "chore: keep GitHub Actions alive [skip ci]"
            git push
          else
            echo "Repository active ($DAYS_SINCE days ago). No keepalive commit needed."
          fi

      - name: Check for upstream update
        id: check
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FORCE_BUILD: ${{ inputs.force_build || 'false' }}
          CUSTOM_VERSION: ${{ inputs.custom_version || '' }}
          CUSTOM_EXECUTION_ID: ${{ inputs.custom_execution_id || '' }}
        run: |
          ./scripts/check-upstream.sh

      - name: Install build dependencies
        if: steps.check.outputs.update_needed == 'true'
        run: |
          sudo apt-get update
          # zsync provides zsyncmake, which appimagetool requires to emit the
          # .zsync file that the embedded update information points at.
          sudo apt-get install -y libfuse2 squashfs-tools zsync

      - name: Build AppImage (x86_64)
        if: steps.check.outputs.update_needed == 'true'
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          ./scripts/build-appimage.sh \
            --version "${{ steps.check.outputs.version }}" \
            --url "${{ steps.check.outputs.download_url }}" \
            --arch "x86_64" \
            --dist-dir "dist"

      - name: Build AppImage (aarch64)
        if: steps.check.outputs.update_needed == 'true' && steps.check.outputs.arm64_available == 'true'
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          ./scripts/build-appimage.sh \
            --version "${{ steps.check.outputs.version }}" \
            --url "${{ steps.check.outputs.download_url_arm64 }}" \
            --arch "aarch64" \
            --dist-dir "dist"

      - name: Regenerate combined SHA256 checksums
        if: steps.check.outputs.update_needed == 'true'
        run: |
          cd dist
          rm -f SHA256SUMS.txt
          shopt -s nullglob
          FILES=(*.AppImage *.zsync)
          if [ ${#FILES[@]} -gt 0 ]; then
            sha256sum "${FILES[@]}" > SHA256SUMS.txt
          fi
          cat SHA256SUMS.txt

      - name: Publish GitHub Release
        if: steps.check.outputs.update_needed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.check.outputs.tag_name }}"
          VERSION="${{ steps.check.outputs.version }}"
          URL="${{ steps.check.outputs.download_url }}"

          if [ "${{ steps.check.outputs.arm64_available }}" = "true" ]; then
            ARCHES="x86_64 and aarch64"
          else
            ARCHES="x86_64"
          fi

          cat <<EOF > release_notes.md
          ## Antigravity Desktop AppImage ($TAG)

          Automated community AppImage build for official **Google Antigravity** v${VERSION}.

          ### Download & Run
          Builds are provided for **${ARCHES}**; pick the one matching \`uname -m\`.
          \`\`\`bash
          chmod +x Antigravity-${VERSION}-<arch>.AppImage
          ./Antigravity-${VERSION}-<arch>.AppImage
          \`\`\`

          ### Delta Updates
          This AppImage supports delta updates using [AppImageUpdate](https://github.com/AppImageCommunity/AppImageUpdate) or [Gear Lever](https://github.com/mijorus/gearlever).

          ### Upstream Details
          - **Official Portal:** https://antigravity.google
          - **Source Archive:** [Antigravity.tar.gz](${URL})

          ### Verification Checksums (SHA256)
          \`\`\`
          $(cat dist/SHA256SUMS.txt)
          \`\`\`
          EOF

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists. Updating release notes and uploading assets..."
            gh release edit "$TAG" \
              --title "Antigravity v${VERSION}" \
              --notes-file release_notes.md \
              --latest
            gh release upload "$TAG" dist/* --clobber
          else
            echo "Creating new release $TAG..."
            gh release create "$TAG" dist/* \
              --title "Antigravity v${VERSION}" \
              --notes-file release_notes.md \
              --latest
          fi

      - name: Summary
        run: |
          echo "### Antigravity AppImage Pipeline Summary" >> $GITHUB_STEP_SUMMARY
          echo "- **Upstream Version:** \`${{ steps.check.outputs.version }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Tag:** \`${{ steps.check.outputs.tag_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **ARM64 Available:** \`${{ steps.check.outputs.arm64_available }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Update Needed:** \`${{ steps.check.outputs.update_needed }}\`" >> $GITHUB_STEP_SUMMARY
